pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

if (JavaVersion.current() < JavaVersion.VERSION_25) {
    throw new IllegalStateException("Minecraft 26.3 requires Gradle to run on Java 25+ (currently ${JavaVersion.current()})")
}

rootProject.name = 'clutterbestiary'

include 'common'
include 'fabric'
include 'neoforge'
