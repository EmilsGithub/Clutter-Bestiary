plugins {
    id 'dev.architectury.loom-no-remap' version '1.17.493' apply false
    id 'architectury-plugin' version '3.5.170'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

def localProperties = new Properties()
def localPropertiesFile = file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

ext.localDevUsername = localProperties.getProperty("dev.username", "")
ext.localDevUuid = localProperties.getProperty("dev.uuid", "")
ext.localReleaseDir = localProperties.getProperty("release.dir", "")

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = rootProject.archives_name
    }

    // Jar names follow `clutterbestiary-<version>-<loader>-<minecraft version>`, e.g. `clutterbestiary-1.2.0-neoforge-26.3.jar`.
    tasks.withType(AbstractArchiveTask).configureEach {
        archiveVersion = "$rootProject.mod_version-$project.name-$rootProject.minecraft_version"
    }

    // If `release.dir` is set in local.properties, also copy the release jar there.
    def localReleaseDir = rootProject.ext.localReleaseDir
    if (localReleaseDir) {
        plugins.withId('com.gradleup.shadow') {
            def copyReleaseJar = tasks.register('copyReleaseJar', Copy) {
                from tasks.named('shadowJar').flatMap { it.archiveFile }
                into localReleaseDir
            }
            tasks.named('shadowJar').configure { finalizedBy copyReleaseJar }
        }
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven { url = 'https://maven.neoforged.net/releases' }
    }

    dependencies {
        // Minecraft 26.1+ is unobfuscated; official names are used directly and no mappings are declared.
        minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    }

    java {
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 25
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = "$rootProject.archives_name-$project.name"
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
